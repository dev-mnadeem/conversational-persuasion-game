server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The game API and health check live on the Python service. Proxying them
    # here keeps the browser on one origin, so CORS never applies.
    location /api/ {
        proxy_pass http://backend:7321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    location /healthz {
        proxy_pass http://backend:7321/healthz;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
